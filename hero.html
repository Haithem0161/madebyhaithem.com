<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Haithem Portfolio - Hero Section</title>
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7f13ec",
                        "background-light": "#f7f6f8",
                        "background-dark": "#191022",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        /* Custom blur for the pill nav */
        .glass-nav {
            background: rgba(25, 16, 34, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Floating background shapes animation style simulation (static for this output) */
        .floating-shape {
            position: absolute;
            border-radius: 999px;
            filter: blur(60px);
            opacity: 0.6;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display antialiased overflow-x-hidden">
    <div class="relative flex h-screen min-h-[600px] w-full flex-col overflow-hidden">
        <!-- Abstract Background Elements -->
        <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
            <!-- Large purple glowing orb top left -->
            <div class="floating-shape w-[500px] h-[500px] bg-primary/30 top-[-100px] left-[-100px]"></div>
            <!-- Darker accent orb bottom right -->
            <div class="floating-shape w-[600px] h-[600px] bg-[#4a0d85]/20 bottom-[-150px] right-[-100px]"></div>
            <!-- Central subtle glow -->
            <div
                class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary/10 rounded-full blur-[100px]">
            </div>
            <!-- 3D Abstract Image -->
            <div class="absolute inset-0 z-0 opacity-40 mix-blend-overlay pointer-events-none bg-center bg-cover bg-no-repeat"
                data-alt="abstract flowing purple and dark liquid 3D shapes"
                style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC-9hjaIgW9CoBJdNRQTEUdLNj6NhIF3qdETTBtv517CnVCWq3nlrMnUYq20CIaxfNd84YrydYb01UvGT2C1q2qp76DyTl-brGNGsb-8hK3iAPsP0PNGL0MmKRsPHy42w8_-jEC_QUE2QPqEHURvsCS8yQ_osSCi9sU2EOlYubnvAo0nIAGh7NflPsaAeVwRWzmVV70RYC6uoU7K6QLnRDiEn5xJtoRuUKxqRM6HnhUlsXMr-tBCb_G0yoN-ADJz8ncMC3Z5HbtGJW0');">
            </div>
        </div>
        <!-- Floating Navigation Pill -->
        <div class="fixed top-8 w-full z-50 flex justify-center px-4">
            <nav class="glass-nav flex items-center gap-1 px-2 py-2 rounded-full shadow-2xl shadow-black/20">
                <a class="flex items-center gap-2 px-6 py-2.5 rounded-full text-white/70 hover:text-white hover:bg-white/10 transition-all duration-200 text-sm font-medium"
                    href="#">
                    <span class="material-symbols-outlined text-[18px]">grid_view</span>
                    Work
                </a>
                <a class="flex items-center gap-2 px-6 py-2.5 rounded-full text-white/70 hover:text-white hover:bg-white/10 transition-all duration-200 text-sm font-medium"
                    href="#">
                    <span class="material-symbols-outlined text-[18px]">person</span>
                    About
                </a>
                <a class="flex items-center gap-2 px-6 py-2.5 rounded-full text-white/70 hover:text-white hover:bg-white/10 transition-all duration-200 text-sm font-medium"
                    href="#">
                    <span class="material-symbols-outlined text-[18px]">mail</span>
                    Contact
                </a>
                <div class="w-px h-5 bg-white/10 mx-1"></div>
                <button
                    class="ml-1 size-9 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 text-white transition-colors">
                    <span class="material-symbols-outlined text-[20px]">search</span>
                </button>
            </nav>
        </div>
        <!-- Hero Content -->
        <main class="relative z-10 flex flex-1 flex-col items-center justify-center px-4 text-center">
            <!-- Main Content Container -->
            <div class="max-w-4xl w-full flex flex-col items-center gap-8 animate-fade-in-up">
                <!-- Avatar/Icon (Optional Decorative Element) -->
                <div class="mb-4 size-20 rounded-full border border-white/10 bg-white/5 p-1 backdrop-blur-sm">
                    <div
                        class="size-full rounded-full bg-gradient-to-br from-primary to-[#4a0d85] flex items-center justify-center shadow-inner">
                        <span class="material-symbols-outlined text-white text-4xl">code</span>
                    </div>
                </div>
                <!-- Typography -->
                <div class="flex flex-col gap-4">
                    <h1 class="text-white text-5xl md:text-7xl lg:text-8xl font-black tracking-tight leading-[1.1]">
                        Haithem
                        <span
                            class="block text-3xl md:text-5xl lg:text-6xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white via-white to-white/60 mt-2">
                            Fullstack Developer
                        </span>
                    </h1>
                    <p class="max-w-2xl mx-auto text-lg md:text-xl text-white/60 leading-relaxed font-light mt-4">
                        Building scalable web applications with pixel-perfect precision.
                        Bridging the gap between engineering and design.
                    </p>
                </div>
                <!-- CTA Actions -->
                <div class="flex flex-col sm:flex-row items-center gap-4 mt-8 w-full sm:w-auto">
                    <button
                        class="group relative flex items-center justify-center gap-2 h-14 px-8 rounded-full bg-primary text-white text-base font-bold tracking-wide shadow-lg shadow-primary/25 hover:bg-primary/90 hover:shadow-primary/40 hover:-translate-y-0.5 transition-all duration-300 w-full sm:w-auto overflow-hidden">
                        <div
                            class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700">
                        </div>
                        <span>See My Work</span>
                        <span
                            class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
                    </button>
                    <button
                        class="flex items-center justify-center gap-2 h-14 px-8 rounded-full bg-white/5 text-white border border-white/10 text-base font-medium hover:bg-white/10 hover:border-white/20 transition-all duration-200 w-full sm:w-auto">
                        <span>Download CV</span>
                        <span class="material-symbols-outlined text-[20px]">download</span>
                    </button>
                </div>
                <!-- Social Proof / Tech Stack Hints -->
                <div class="mt-16 pt-8 border-t border-white/5 w-full max-w-lg">
                    <p class="text-white/40 text-xs font-semibold uppercase tracking-widest mb-4">Tech Stack</p>
                    <div
                        class="flex justify-center gap-8 text-white/30 grayscale hover:grayscale-0 transition-all duration-500">
                        <!-- Simple icon representations for tech stack -->
                        <div class="flex flex-col items-center gap-2 hover:text-white transition-colors cursor-default">
                            <span class="material-symbols-outlined text-3xl">javascript</span>
                        </div>
                        <div class="flex flex-col items-center gap-2 hover:text-white transition-colors cursor-default">
                            <span class="material-symbols-outlined text-3xl">html</span>
                        </div>
                        <div class="flex flex-col items-center gap-2 hover:text-white transition-colors cursor-default">
                            <span class="material-symbols-outlined text-3xl">css</span>
                        </div>
                        <div class="flex flex-col items-center gap-2 hover:text-white transition-colors cursor-default">
                            <span class="material-symbols-outlined text-3xl">database</span>
                        </div>
                        <div class="flex flex-col items-center gap-2 hover:text-white transition-colors cursor-default">
                            <span class="material-symbols-outlined text-3xl">cloud</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <!-- Bottom right decorative indicator -->
        <div class="absolute bottom-8 right-8 hidden md:flex items-center gap-2 text-white/20">
            <span class="text-xs font-mono tracking-widest">SCROLL</span>
            <div class="h-10 w-[1px] bg-gradient-to-b from-white/20 to-transparent"></div>
        </div>
    </div>
</body>

</html>
